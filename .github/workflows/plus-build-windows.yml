# Publii Plus: unsigned Windows installer (NSIS) as a workflow artifact.
# Runs on pushes to master and manually (Actions -> Build Windows -> Run workflow).
name: Build Windows

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app
      - name: Build UI
        run: |
          npm run prepare-editor
          npm run prod
      - name: Package installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder build --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: publii-plus-windows-${{ github.sha }}
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: error
